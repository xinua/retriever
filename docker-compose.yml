services:
  retriever:
    build: .
    container_name: retriever
    image: retriever
    ports:
      - "8000:8000"

    environment:
      PORT: 8000
      HOST: 0.0.0.0
      DATA_DIR: /data
      DOWNLOADS_DIR: ./downloads
      # The clock a subscription's poll hours are read against: the times a
      # "time" subscription polls at, and the hours an interval is restricted
      # to, are wall-clock and mean whatever this says they mean. Left unset
      # the container is UTC, so set it to your own zone or a 09:00 poll will
      # not happen at 09:00 for you.
      TZ: Etc/UTC
      # Uncomment together with the `pot` service below to route YouTube
      # extraction through a proof-of-origin token provider. Left unset, the
      # POT plugin is never loaded and yt-dlp behaves exactly as before.
      # POT_BASE_URL: http://pot:4416

    volumes:
      - ./data:/data
      # Where yt-dlp writes finished files.
      - ./downloads:/downloads

    restart: unless-stopped

  # The POT provider server. Optional — see the README. Keep its tag in step
  # with POT_PLUGIN_VERSION in the Dockerfile.
  # pot:
  #   image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
  #   container_name: retriever-pot
  #   init: true
  #   restart: unless-stopped
