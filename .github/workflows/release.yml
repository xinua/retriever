name: Publish container image

on:
  push:
    tags:
      - 'v*'
  # Lets you re-run a publish without cutting a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.1.2)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The runner is amd64, so the arm64 leg of the build runs under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One value for both triggers: the pushed tag, or the one typed manually.
      - name: Resolve the tag being published
        run: echo "SRC_TAG=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.SRC_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.SRC_TAG }}
            type=semver,pattern={{major}},value=${{ env.SRC_TAG }}
          flavor: |
            latest=true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
